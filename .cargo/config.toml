[build]
target = "riscv32imc-unknown-none-elf"

[target.riscv32imc-unknown-none-elf]
rustflags = [
  "-C", "link-arg=-Tmemory.x",
  "-C", "link-arg=-Tlink.x",
]

# Assembly listings (RISC-V GNU asm from LLVM). See docs/README.md.
# Named gen-asm* so they do not shadow the optional `cargo-asm` subcommand.
[alias]
gen-asm = "rustc --release -- --emit asm=target/ch32v003-ili9341-release.s"
gen-asm-dev = "rustc -- -C debuginfo=2 --emit asm=target/ch32v003-ili9341-dev.s"
